<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超市商品效期管理系統 (儀表板升級版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入條碼掃描專用函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-6xl mx-auto">
        <!-- 頂部標題與狀態 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-bold text-gray-800">📦 效期與商品庫系統</h1>
                <span id="sync-status" class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded-full font-bold">連線準備中...</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-gray-500">今日日期：<span id="today-date" class="font-semibold text-gray-700"></span></div>
                <button onclick="exportToCSV()" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition font-medium shadow-sm">
                    📥 匯出 CSV 報表
                </button>
            </div>
        </div>

        <!-- 📊 營運數據儀表板 (Stats Dashboard) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-blue-500 flex flex-col justify-between">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">總庫存件數</span>
                <span id="stat-total-qty" class="text-2xl font-bold text-gray-800 mt-2">0 件</span>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-red-500 flex flex-col justify-between">
                <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">🔴 嚴重屆期 (&lt;14天)</span>
                <span id="stat-red-count" class="text-2xl font-bold text-red-600 mt-2">0 項</span>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-yellow-500 flex flex-col justify-between">
                <span class="text-xs font-semibold text-yellow-600 uppercase tracking-wider">🟡 黃燈警告 (14-29天)</span>
                <span id="stat-yellow-count" class="text-2xl font-bold text-yellow-600 mt-2">0 項</span>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-green-500 flex flex-col justify-between">
                <span class="text-xs font-semibold text-green-600 uppercase tracking-wider">🟢 安全庫存 (30天以上)</span>
                <span id="stat-green-count" class="text-2xl font-bold text-green-600 mt-2">0 項</span>
            </div>
        </div>

        <!-- 視圖切換與搜尋列 -->
        <div class="bg-white p-4 rounded-lg shadow-md mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="flex bg-gray-100 p-1 rounded-lg w-full md:w-auto">
                <button id="btn-view-list" onclick="switchView('list')" class="flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition bg-white shadow-sm text-blue-600">📋 庫存清單視圖</button>
                <button id="btn-view-calendar" onclick="switchView('calendar')" class="flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-800">📅 效期月曆視圖</button>
            </div>

            <div class="w-full md:w-80 relative" id="search-box-container">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">🔍</span>
                <input type="text" id="search-input" placeholder="快速搜尋庫存清單..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-sm">
            </div>
        </div>

        <!-- 新增商品表單 (常用商品按鈕 + 相機掃描) -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-700">新增盤點商品</h2>
                <button type="button" onclick="toggleScanner()" id="scanner-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition font-medium text-sm flex items-center gap-2 shadow-sm">
                    📷 開啟相機掃描條碼
                </button>
            </div>

            <!-- ⚡ 常用商品快速點選面板 -->
            <div class="mb-6 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                <p class="text-xs font-semibold text-blue-700 mb-2 flex items-center gap-1">
                    ⚡ 常用商品快速點選（點擊即可一鍵帶入名稱與條碼）：
                </p>
                <div id="quick-buttons-grid" class="flex flex-wrap gap-2">
                    <!-- 動態載入 -->
                </div>
            </div>

            <!-- 相機即時預畫面框 -->
            <div id="scanner-container" class="hidden mb-6 p-4 bg-gray-50 border rounded-lg max-w-md mx-auto text-center shadow-inner">
                <p class="text-xs text-gray-500 mb-2">請將商品的條碼對準下方掃描框</p>
                <div id="reader" class="w-full rounded overflow-hidden border"></div>
                <button type="button" onclick="stopScanner()" class="mt-3 bg-red-500 text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-red-600 transition">關閉相機</button>
            </div>

            <form id="add-item-form" class="flex flex-col md:flex-row gap-4 items-end relative">
                <div class="flex-1 w-full relative">
                    <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱 (點上方按鈕、掃描條碼或打字聯想)</label>
                    <input type="text" id="item-name" autocomplete="off" required placeholder="點選上方常用按鈕或輸入關鍵字..." class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <input type="hidden" id="item-barcode" value="">
                    
                    <!-- 智慧聯想下拉選單 -->
                    <div id="suggestions-box" class="hidden absolute left-0 right-0 top-16 bg-white border border-gray-200 rounded-md shadow-lg z-50 max-h-48 overflow-y-auto"></div>
                </div>
                <div class="w-full md:w-32">
                    <label class="block text-sm font-medium text-gray-700 mb-1">數量</label>
                    <input type="number" id="item-quantity" required min="1" value="1" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="w-full md:w-48">
                    <label class="block text-sm font-medium text-gray-700 mb-1">有效期限 (Best Before)</label>
                    <input type="date" id="item-date" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full md:w-auto bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition font-medium">新增至庫存</button>
            </form>
        </div>

        <!-- 視圖 A：列表清單容器 -->
        <div id="view-list-container" class="bg-white rounded-lg shadow-md overflow-x-auto">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center text-sm text-gray-500">
                <span id="item-count-text">共載入 0 項商品</span>
                <span>💡 提示：點擊數量按鈕可直接增減庫存</span>
            </div>
            <table class="min-w-full text-left border-collapse whitespace-nowrap">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="px-6 py-4 font-semibold text-gray-700">商品名稱 / 條碼</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">有效期限</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">剩餘天數</th>
                        <th class="px-6 py-4 font-semibold text-gray-700 text-center">剩餘數量</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">狀態預警</th>
                        <th class="px-6 py-4 font-semibold text-gray-700 text-center">操作</th>
                    </tr>
                </thead>
                <tbody id="inventory-list" class="divide-y divide-gray-200">
                    <!-- 動態載入 -->
                </tbody>
            </table>
        </div>

        <!-- 視圖 B：效期月曆容器 -->
        <div id="view-calendar-container" class="hidden bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-6">
                <button onclick="changeMonth(-1)" class="px-4 py-2 border rounded-md hover:bg-gray-50 font-medium text-gray-700">◀ 上個月</button>
                <h2 id="calendar-month-title" class="text-xl font-bold text-gray-800">2026年 9月</h2>
                <button onclick="changeMonth(1)" class="px-4 py-2 border rounded-md hover:bg-gray-50 font-medium text-gray-700">下個月 ▶</button>
            </div>
            <div class="flex flex-wrap gap-4 mb-4 text-xs font-medium text-gray-600 bg-gray-50 p-3 rounded-md border">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-red-500 rounded-full inline-block"></span> 🔴 屆期 (&lt;14天)</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></span> 🟡 警告 (&lt;30天)</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span> 🟢 安全 (30天以上)</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 bg-gray-400 rounded-full inline-block"></span> ⚫️ 已過期</div>
            </div>
            <div class="grid grid-cols-7 gap-2 text-center font-bold text-gray-500 mb-2">
                <div class="text-red-500">日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div class="text-blue-500">六</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
        </div>
    </div>

    <!-- 引入 Firebase 與業務邏輯模組 -->
    <script type="module">
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        document.getElementById('today-date').textContent = today.toLocaleDateString('zh-TW');

        let currentInventory = [];
        let productDatabase = {};
        let db, inventoryCol, productsCol, firestoreMethods;
        let currentView = 'list'; 
        let calendarYear = today.getFullYear();
        let calendarMonth = today.getMonth();
        let html5QrCode = null;

        const defaultProducts = {
            "7315122013870": "榛果牛奶巧克力片 100g",
            "7315122013122": "牛奶巧克力片 100g",
            "10524748": "黑巧克力片 100g",
            "00524744": "牛奶巧克力片 100g (005)",
            "S1897191": "Kullamust 原味蘋果飲料 250ml",
            "S2108050": "Kullamust 綜合果汁 250ml (蘋果/柳橙)",
            "S2108030": "Kullamust 綜合果汁 250ml (蘋果/葡萄柚)",
            "7315122145694": "OLW Cheez doodles 起司洋芋片",
            "7310532106501": "Estrella 洋芋片",
            "S1696203": "WASA 香草起司夾心餅乾 30g",
            "471000001": "鮮乳 (全脂)"
        };

        // 更新營運數據儀表板數值
        function updateDashboardStats() {
            let totalQty = 0;
            let redCount = 0;
            let yellowCount = 0;
            let greenCount = 0;

            currentInventory.forEach(item => {
                const qty = parseInt(item.quantity) || 0;
                totalQty += qty;

                const expiryDate = new Date(item.expiry);
                expiryDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((expiryDate - today) / (1000 * 60 * 60 * 24));

                if (diffDays < 14) {
                    redCount++;
                } else if (diffDays < 30) {
                    yellowCount++;
                } else {
                    greenCount++;
                }
            });

            document.getElementById('stat-total-qty').textContent = `${totalQty} 件`;
            document.getElementById('stat-red-count').textContent = `${redCount} 項`;
            document.getElementById('stat-yellow-count').textContent = `${yellowCount} 項`;
            document.getElementById('stat-green-count').textContent = `${greenCount} 項`;
        }

        function renderQuickButtons() {
            const grid = document.getElementById('quick-buttons-grid');
            grid.innerHTML = '';
            
            for (const [barcode, name] of Object.entries(productDatabase)) {
                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = "bg-white border border-blue-200 text-blue-700 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-md text-xs font-medium transition shadow-sm";
                btn.textContent = name;
                btn.onclick = function() {
                    document.getElementById('item-name').value = name;
                    document.getElementById('item-barcode').value = barcode;
                };
                grid.appendChild(btn);
            }
        }

        window.toggleScanner = async function() {
            const container = document.getElementById('scanner-container');
            if (!container.classList.contains('hidden')) {
                stopScanner();
                return;
            }

            container.classList.remove('hidden');
            document.getElementById('scanner-btn').textContent = "🔴 關閉相機";

            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("reader");
                }

                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 260, height: 140 }, aspectRatio: 1.0 },
                    (decodedText) => {
                        const matchedName = productDatabase[decodedText] || `新商品 (條碼: ${decodedText})`;
                        document.getElementById('item-name').value = matchedName;
                        document.getElementById('item-barcode').value = decodedText;
                        
                        if (productDatabase[decodedText]) {
                            alert(`✅ 成功辨識商品：\n${matchedName}`);
                        } else {
                            alert(`⚠️ 掃描到新條碼：${decodedText}\n已自動填入代碼，請確認品名後直接新增！`);
                        }
                        stopScanner();
                    },
                    (errorMessage) => {}
                );
            } catch (err) {
                console.error("相機啟動失敗：", err);
                alert("無法啟動相機！請確認：\n1. 瀏覽器已授權相機權限。\n2. 網址為 https:// 安全連線。");
                stopScanner();
            }
        };

        window.stopScanner = function() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                    document.getElementById('scanner-btn').textContent = "📷 開啟相機掃描條碼";
                }).catch(err => {
                    document.getElementById('scanner-container').classList.add('hidden');
                    document.getElementById('scanner-btn').textContent = "📷 開啟相機掃描條碼";
                });
            } else {
                document.getElementById('scanner-container').classList.add('hidden');
                document.getElementById('scanner-btn').textContent = "📷 開啟相機掃描條碼";
            }
        };

        const nameInput = document.getElementById('item-name');
        const suggestionsBox = document.getElementById('suggestions-box');

        nameInput.addEventListener('input', function() {
            const keyword = this.value.trim().toLowerCase();
            suggestionsBox.innerHTML = '';
            
            if (keyword.length === 0) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            const matches = Object.entries(productDatabase).filter(([barcode, name]) => {
                return name.toLowerCase().includes(keyword) || barcode.toLowerCase().includes(keyword);
            });

            if (matches.length > 0) {
                suggestionsBox.classList.remove('hidden');
                matches.forEach(([barcode, name]) => {
                    const div = document.createElement('div');
                    div.className = "px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm border-b flex justify-between items-center";
                    div.innerHTML = `<span class="font-medium text-gray-800">${name}</span><span class="text-xs text-gray-400">條碼: ${barcode}</span>`;
                    div.onclick = function() {
                        nameInput.value = name;
                        document.getElementById('item-barcode').value = barcode;
                        suggestionsBox.classList.add('hidden');
                    };
                    suggestionsBox.appendChild(div);
                });
            } else {
                suggestionsBox.classList.add('hidden');
            }
        });

        document.addEventListener('click', function(e) {
            if (!nameInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });

        window.switchView = function(viewType) {
            currentView = viewType;
            const listContainer = document.getElementById('view-list-container');
            const calContainer = document.getElementById('view-calendar-container');
            const btnList = document.getElementById('btn-view-list');
            const btnCal = document.getElementById('btn-view-calendar');
            const searchBox = document.getElementById('search-box-container');

            if (viewType === 'list') {
                listContainer.classList.remove('hidden');
                calContainer.classList.add('hidden');
                searchBox.classList.remove('hidden');
                btnList.className = "flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition bg-white shadow-sm text-blue-600";
                btnCal.className = "flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-800";
                renderTable();
            } else {
                listContainer.classList.add('hidden');
                calContainer.classList.remove('hidden');
                searchBox.classList.add('hidden');
                btnCal.className = "flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition bg-white shadow-sm text-blue-600";
                btnList.className = "flex-1 md:flex-none px-6 py-2 rounded-md font-medium text-sm transition text-gray-600 hover:text-gray-800";
                renderCalendar();
            }
        };

        function calculateStatus(expiryDateStr) {
            const expiryDate = new Date(expiryDateStr);
            expiryDate.setHours(0, 0, 0, 0);
            const diffTime = expiryDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let status = '', rowClass = '', badgeClass = '';
            if (diffDays < 0) {
                status = '已過期'; rowClass = 'bg-gray-200 text-gray-500'; badgeClass = 'bg-gray-100 border-gray-300 text-gray-700';
            } else if (diffDays < 14) {
                status = '屆期 (<14天)'; rowClass = 'bg-red-50 text-red-900'; badgeClass = 'bg-red-50 border-red-200 text-red-700';
            } else if (diffDays < 30) {
                status = '警告 (<30天)'; rowClass = 'bg-yellow-50 text-yellow-900'; badgeClass = 'bg-yellow-50 border-yellow-200 text-yellow-800';
            } else {
                status = '安全'; rowClass = 'bg-green-50 text-green-900'; badgeClass = 'bg-green-50 border-green-200 text-green-700';
            }
            return { diffDays, status, rowClass, badgeClass };
        }

        function renderTable() {
            const tbody = document.getElementById('inventory-list');
            const keyword = document.getElementById('search-input').value.trim().toLowerCase();
            tbody.innerHTML = '';

            let filteredData = currentInventory.filter(item => item.name.toLowerCase().includes(keyword));
            filteredData.sort((a, b) => new Date(a.expiry) - new Date(b.expiry));

            document.getElementById('item-count-text').textContent = `顯示 ${filteredData.length} / 共 ${currentInventory.length} 項商品`;

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-gray-400">沒有找到符合的商品資料</td></tr>`;
                return;
            }
            
            filteredData.forEach(item => {
                const { diffDays, status, rowClass } = calculateStatus(item.expiry);
                let statusIcon = status.includes('已過期') ? '⚫️ ' : status.includes('屆期') ? '🔴 ' : status.includes('警告') ? '🟡 ' : '🟢 ';

                const tr = document.createElement('tr');
                tr.className = `hover:bg-opacity-80 transition ${rowClass}`;
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium">${item.name}</td>
                    <td class="px-6 py-4">${item.expiry}</td>
                    <td class="px-6 py-4 font-bold">${diffDays < 0 ? '已過期 ' + Math.abs(diffDays) : diffDays} 天</td>
                    <td class="px-6 py-4 text-center">
                        <div class="flex items-center justify-center gap-3">
                            <button onclick="updateQuantity('${item.id}', ${item.quantity}, -1)" class="w-8 h-8 flex items-center justify-center bg-white border border-gray-300 rounded hover:bg-gray-100 font-bold text-gray-600 shadow-sm">-</button>
                            <span class="w-8 text-center font-bold text-lg">${item.quantity}</span>
                            <button onclick="updateQuantity('${item.id}', ${item.quantity}, 1)" class="w-8 h-8 flex items-center justify-center bg-white border border-gray-300 rounded hover:bg-gray-100 font-bold text-gray-600 shadow-sm">+</button>
                        </div>
                    </td>
                    <td class="px-6 py-4">${statusIcon}${status}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteItem('${item.id}')" class="text-red-500 hover:text-red-700 font-medium bg-white px-3 py-1 rounded shadow-sm border border-red-200 hover:bg-red-50">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderCalendar() {
            document.getElementById('calendar-month-title').textContent = `${calendarYear}年 ${calendarMonth + 1}月`;
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';

            const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
            const totalDays = new Date(calendarYear, calendarMonth + 1, 0).getDate();

            const expiryMap = {};
            currentInventory.forEach(item => {
                if (!expiryMap[item.expiry]) expiryMap[item.expiry] = [];
                expiryMap[item.expiry].push(item);
            });

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-32 bg-gray-50 rounded-lg border border-transparent";
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const monthStr = String(calendarMonth + 1).padStart(2, '0');
                const dayStr = String(day).padStart(2, '0');
                const dateKey = `${calendarYear}-${monthStr}-${dayStr}`;

                const cell = document.createElement('div');
                cell.className = "h-32 bg-white rounded-lg border border-gray-200 p-2 overflow-y-auto flex flex-col justify-between";

                const isToday = (calendarYear === today.getFullYear() && calendarMonth === today.getMonth() && day === today.getDate());
                let dayHeaderClass = "font-bold text-sm mb-1 flex justify-between items-center";
                if (isToday) dayHeaderClass += " text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded";
                else dayHeaderClass += " text-gray-700";

                let htmlContent = `<div class="${dayHeaderClass}"><span>${day}</span>`;
                if (expiryMap[dateKey] && expiryMap[dateKey].length > 0) {
                    htmlContent += `<span class="bg-gray-100 text-gray-600 text-[10px] px-1 rounded-full font-medium">${expiryMap[dateKey].length}項</span>`;
                }
                htmlContent += `</div><div class="space-y-1">`;

                if (expiryMap[dateKey]) {
                    expiryMap[dateKey].forEach(item => {
                        const { diffDays, badgeClass } = calculateStatus(item.expiry);
                        let icon = diffDays < 0 ? '⚫️' : diffDays < 14 ? '🔴' : diffDays < 30 ? '🟡' : '🟢';
                        htmlContent += `<div class="border text-xs px-1.5 py-0.5 rounded truncate ${badgeClass}" title="${item.name}">${icon} ${item.name} (${item.quantity})</div>`;
                    });
                }
                htmlContent += `</div>`;
                cell.innerHTML = htmlContent;
                grid.appendChild(cell);
            }
        }

        window.changeMonth = function(direction) {
            calendarMonth += direction;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            else if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            renderCalendar();
        };

        document.getElementById('search-input').addEventListener('input', function() {
            if (currentView === 'list') renderTable();
        });

        try {
            document.getElementById('sync-status').textContent = '連線中...';
            document.getElementById('sync-status').className = 'bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-bold animate-pulse';

            const firebaseApp = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js");
            const firestore = await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js");
            firestoreMethods = firestore;

            const firebaseConfig = {
                apiKey: "AIzaSyC2piZwjxvqya3gXkWCjz99bcO5MZxvuLI",
                authDomain: "market-inventory-ef68c.firebaseapp.com",
                projectId: "market-inventory-ef68c",
                storageBucket: "market-inventory-ef68c.firebasestorage.app",
                messagingSenderId: "307248314866",
                appId: "1:307248314866:web:97f3edb8e9e47a22ed536b",
                measurementId: "G-TSC3T2W3MD"
            };

            const app = firebaseApp.initializeApp(firebaseConfig);
            db = firestore.getFirestore(app);
            inventoryCol = firestore.collection(db, "inventory");
            productsCol = firestore.collection(db, "products");

            firestore.onSnapshot(productsCol, (snapshot) => {
                if (snapshot.empty) {
                    for (const [barcode, name] of Object.entries(defaultProducts)) {
                        firestore.addDoc(productsCol, { barcode, name });
                    }
                } else {
                    productDatabase = {};
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.barcode && data.name) {
                            productDatabase[data.barcode] = data.name;
                        }
                    });
                    renderQuickButtons();
                }
            });

            firestore.onSnapshot(inventoryCol, (snapshot) => {
                currentInventory = [];
                snapshot.forEach((docSnap) => {
                    currentInventory.push({ id: docSnap.id, ...docSnap.data() });
                });

                // 更新儀表板數據
                updateDashboardStats();

                if (currentView === 'list') renderTable();
                else renderCalendar();
                
                document.getElementById('sync-status').textContent = '✅ 已連線';
                document.getElementById('sync-status').className = 'bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-bold';
            }, (error) => {
                console.error("Firestore 權限錯誤: ", error);
                document.getElementById('sync-status').textContent = '⚠️ 權限錯誤';
                document.getElementById('sync-status').className = 'bg-red-100 text-red-700 text-xs px-2 py-1 rounded-full font-bold';
            });

        } catch (e) {
            console.error("Firebase 載入崩潰: ", e);
            document.getElementById('sync-status').textContent = '❌ 載入失敗';
            document.getElementById('sync-status').className = 'bg-red-100 text-red-700 text-xs px-2 py-1 rounded-full font-bold';
        }

        window.updateQuantity = async function(id, currentQty, delta) {
            if (!db) return alert("連線異常，無法更新資料");
            let newQty = currentQty + delta;
            if (newQty < 0) newQty = 0;
            const itemRef = firestoreMethods.doc(db, "inventory", id);
            await firestoreMethods.updateDoc(itemRef, { quantity: newQty });
        };

        window.deleteItem = async function(id) {
            if (!db) return alert("連線異常，無法刪除資料");
            await firestoreMethods.deleteDoc(firestoreMethods.doc(db, "inventory", id));
        };

        window.exportToCSV = function() {
            let csvContent = "商品名稱,有效期限,剩餘天數,剩餘數量,狀態\n";
            currentInventory.sort((a, b) => new Date(a.expiry) - new Date(b.expiry)).forEach(item => {
                const { diffDays, status } = calculateStatus(item.expiry);
                const safeName = `"${item.name.replace(/"/g, '""')}"`;
                csvContent += `${safeName},${item.expiry},${diffDays},${item.quantity},${status}\n`;
            });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.setAttribute("href", URL.createObjectURL(blob));
            link.setAttribute("download", `商品效期與庫存盤點表_${today.toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        document.getElementById('add-item-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!db) return alert("連線異常，無法新增資料");
            const name = document.getElementById('item-name').value;
            const barcode = document.getElementById('item-barcode').value;
            const quantity = parseInt(document.getElementById('item-quantity').value, 10);
            const expiry = document.getElementById('item-date').value;
            
            await firestoreMethods.addDoc(inventoryCol, {
                name: name,
                barcode: barcode || "",
                quantity: quantity || 1,
                expiry: expiry
            });

            if (barcode && !productDatabase[barcode]) {
                await firestoreMethods.addDoc(productsCol, { barcode: barcode, name: name });
            }
            
            this.reset();
            document.getElementById('item-barcode').value = '';
        });
    </script>
</body>
</html>
